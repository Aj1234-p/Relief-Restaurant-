<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relief Restaurant</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="logo-links-container">
      <div class="logo-container">
         <img src="logo.png" alt="reliefLogo">
         <p id="rest-name">Relief Restaurant Menu</p>
         <p id="slogan">Your relief here!</p>
         <div id="border1"></div>
        </div>
        <div class="links-container">
          <div class="quick-links">
            <h3>Quick Links</h3>
            <ul class="sub-links">
              <li><a href="#">1. Home</a></li>
              <li><a href="#">2. Your Orders</a></li>
              <li><a href="#">3. Wallet</a></li>
              <li><a href="#">4. Profile</a></li>
              <li><a href="#">5. Logout</a></li>
              <li><a href="#f-item">6. Menu</a></li>
              <span><i class="fa-solid fa-square-plus"></i></span>
            </ul>
            <div id="border2"></div>
          </div>
        <div class="about-us">
          <h3>More About Us</h3>
          <ul class="sub-links">
            <li><a href="#">1. Our Blog</a></li>
            <li><a href="#">2. Upcoming Dishes</a></li>
            <li><a href="#">3. Our Story</a></li>
            <li><a href="#">4. Social Media Links</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="menu-container">
      <div class="search-container" >
        <div id="search">
          <label for="search-ipt"></label>
          <input type="text" placeholder="Search food items"  id="search-ipt">

        </div>
        <div id="buttons">
          <button class="btn" id="signup-btn">Signup</button>
          <button class="btn" id="login-btn">Login</button>
          <img src="logo.png" alt="cornerLogo" id="corner-logo">
        </div>
      </div>
      <div class="banner">
        <img src="banner.png" alt="pizzaBanner">
      </div>
      <div id="f-item">
        <h3>MENU</h3>
        <div class="food-item">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="./script.js"></script>
</html>
